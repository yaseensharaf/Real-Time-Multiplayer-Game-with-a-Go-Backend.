<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>game-arena — real-time match engine</title>
<meta name="description" content="Server-authoritative real-time multiplayer, built in Go.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Blueprint ground: navy rather than black, so the two signal colours
       read as instruments on a panel instead of neon on a void. */
    --ground:   #0B1A2E;
    --panel:    #10243C;
    --panel-hi: #16304E;
    --rule:     #1E3A5C;
    --ink:      #D6E4F0;
    --muted:    #6E8BA8;
    --x:        #45D9F5;
    --o:        #FFB347;
    --alert:    #FF7A85;

    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --disp: 'IBM Plex Sans Condensed', 'IBM Plex Sans', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: clamp(12px, 3vw, 32px);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 14px;
    /* Drafting grid: 24px minor rule, barely visible, establishes the
       blueprint register before a single word is read. */
    background-image:
      linear-gradient(rgba(69,217,245,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(69,217,245,.045) 1px, transparent 1px);
    background-size: 24px 24px;
  }

  /* ---------- shell ---------- */

  .console {
    width: min(940px, 100%);
    background: var(--panel);
    border: 1px solid var(--rule);
    box-shadow: 0 24px 70px -24px rgba(0,0,0,.75);
  }

  .masthead {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 14px 18px;
    border-bottom: 1px solid var(--rule);
  }

  .wordmark {
    font-family: var(--disp);
    font-weight: 700;
    font-size: 17px;
    letter-spacing: .01em;
    text-transform: uppercase;
    margin-right: auto;
  }
  .wordmark span { color: var(--muted); font-weight: 600; }

  .readout {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .readout b {
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  .beacon {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--rule);
    flex: none;
  }
  .beacon[data-state="live"] { background: #4ADE80; box-shadow: 0 0 9px #4ADE80; animation: throb 2s ease-in-out infinite; }
  .beacon[data-state="lost"] { background: var(--alert); box-shadow: 0 0 9px var(--alert); }
  @keyframes throb { 50% { opacity: .3; } }

  /* ---------- two-column body ---------- */

  .bay {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 300px);
  }
  .stage  { padding: clamp(18px, 3vw, 28px); min-width: 0; }
  .column { width: 100%; max-width: 400px; margin: 0 auto; }
  .scope  { border-left: 1px solid var(--rule); min-width: 0; display: flex; flex-direction: column; }

  /* ---------- identity strip ---------- */

  .whoami {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px dashed var(--rule);
  }
  .whoami .caption {
    font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted); line-height: 1.5;
  }
  .sigil {
    width: 46px; height: 46px; flex: none;
    display: grid; place-items: center;
    font-family: var(--disp); font-weight: 700; font-size: 26px;
    border: 1px solid var(--rule);
    color: var(--muted);
    transition: color .2s, border-color .2s, box-shadow .2s;
  }
  .sigil[data-mark="X"] { color: var(--x); border-color: var(--x); box-shadow: inset 0 0 22px rgba(69,217,245,.14); }
  .sigil[data-mark="O"] { color: var(--o); border-color: var(--o); box-shadow: inset 0 0 22px rgba(255,179,71,.14); }

  .turnbar {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  }
  .turnbar i {
    display: block; width: 34px; height: 3px; background: var(--rule);
    transition: background .25s;
  }
  .turnbar i[data-turn="X"] { background: var(--x); }
  .turnbar i[data-turn="O"] { background: var(--o); }

  /* ---------- board ---------- */

  /* Capped and centred: an uncapped board pushed the status line and the
     primary action below the fold on a laptop viewport. */
  .grid-wrap { position: relative; }

  #grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    background: var(--rule);
    border: 1px solid var(--rule);
  }

  .cell {
    position: relative;
    aspect-ratio: 1;
    display: grid; place-items: center;
    background: var(--ground);
    border: 0; margin: 0; padding: 0;
    font-family: var(--disp);
    font-weight: 700;
    font-size: clamp(2.2rem, 9vw, 3.4rem);
    line-height: 1;
    color: transparent;
    cursor: pointer;
    transition: background .15s;
  }
  .cell:hover:not(:disabled) { background: var(--panel-hi); }
  .cell:disabled { cursor: default; }
  .cell:focus-visible { outline: 2px solid var(--ink); outline-offset: -3px; }

  /* Coordinate label, drafting-style: makes the board legible as a
     addressable grid, which is exactly what the protocol treats it as. */
  .cell::after {
    content: attr(data-idx);
    position: absolute; top: 5px; left: 7px;
    font-family: var(--mono); font-size: 9px; font-weight: 400;
    color: var(--muted); opacity: .38;
  }

  .cell[data-mark="X"] { color: var(--x); }
  .cell[data-mark="O"] { color: var(--o); }
  .cell[data-fresh="1"] { animation: land .32s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes land { from { transform: scale(.55); opacity: 0; } }

  /* Winning stroke drawn from the server's winLine — the client never
     works out who won, it just renders what it was told. */
  .strike {
    position: absolute; inset: 0;
    pointer-events: none;
    width: 100%; height: 100%;
  }
  /* The board is square, so the viewBox scales uniformly and stroke width can
     be expressed in user units. Using non-scaling-stroke here would make the
     dash array resolve in screen pixels instead — which drew the line only
     partway across, with a stray cap floating at the far end. */
  .strike line {
    stroke-width: 1;
    stroke-linecap: round;
    filter: drop-shadow(0 0 5px currentColor);
    opacity: .95;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: draw .55s .12s ease-out forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* ---------- status + action ---------- */

  .status {
    margin-top: 16px;
    display: flex; align-items: baseline; gap: 9px;
    font-size: 13px; min-height: 22px;
  }
  .status .chev { color: var(--muted); }
  .status .text { color: var(--ink); }
  .status .text[data-tone="x"]     { color: var(--x); }
  .status .text[data-tone="o"]     { color: var(--o); }
  .status .text[data-tone="muted"] { color: var(--muted); }
  .status .text[data-tone="alert"] { color: var(--alert); }

  .caret {
    display: inline-block; width: 6px; height: 13px;
    background: currentColor; vertical-align: -2px; margin-left: 5px;
    animation: wink 1.05s step-end infinite;
  }
  @keyframes wink { 50% { opacity: 0; } }

  .again {
    margin-top: 16px; width: 100%; padding: 11px;
    font-family: var(--mono); font-size: 11px;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--ground); background: var(--ink);
    border: 1px solid var(--ink); cursor: pointer;
    transition: opacity .15s;
  }
  .again:hover { opacity: .86; }
  .again:disabled { background: transparent; color: var(--muted); border-color: var(--rule); cursor: default; }
  .again[hidden] { display: none; }

  /* ---------- signature: protocol inspector ---------- */

  .scope-head {
    display: flex; align-items: center; gap: 8px;
    padding: 13px 16px; border-bottom: 1px solid var(--rule);
    font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  }
  .scope-head .count { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink); }

  #frames {
    flex: 1;
    margin: 0; padding: 10px 0;
    list-style: none;
    overflow-y: auto;
    max-height: 380px;
    scrollbar-width: thin;
    scrollbar-color: var(--rule) transparent;
  }
  #frames::-webkit-scrollbar { width: 6px; }
  #frames::-webkit-scrollbar-thumb { background: var(--rule); }

  .frame {
    display: grid;
    grid-template-columns: 14px minmax(0,1fr) auto;
    gap: 8px; align-items: baseline;
    padding: 4px 16px;
    font-size: 11px; line-height: 1.45;
    animation: slip .22s ease-out;
  }
  @keyframes slip { from { opacity: 0; transform: translateX(6px); } }

  .frame .dir  { font-weight: 600; }
  .frame .name { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frame .meta { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }

  .frame[data-dir="in"]  .dir { color: var(--x); }
  .frame[data-dir="out"] .dir { color: var(--o); }
  .frame[data-kind="err"] .name { color: var(--alert); }

  .scope-foot {
    border-top: 1px solid var(--rule);
    padding: 11px 16px 13px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .stat .k { font-size: 9px; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); }
  .stat .v { font-size: 15px; font-variant-numeric: tabular-nums; margin-top: 2px; }

  .legend {
    padding: 10px 16px 14px;
    font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); border-top: 1px solid var(--rule); line-height: 1.7;
  }

  /* ---------- responsive ---------- */

  @media (max-width: 720px) {
    .bay { grid-template-columns: 1fr; }
    .scope { border-left: 0; border-top: 1px solid var(--rule); }
    #frames { max-height: 168px; }
    .masthead { gap: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .strike line { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>

<main class="console">
  <header class="masthead">
    <div class="wordmark">game<span>-</span>arena</div>

    <div class="readout"><span class="beacon" id="beacon"></span><b id="link">offline</b></div>
    <div class="readout">rtt <b id="rtt">—</b></div>
    <div class="readout">room <b id="room">—</b></div>
  </header>

  <div class="bay">
    <section class="stage">
     <div class="column">
      <div class="whoami">
        <div class="sigil" id="sigil" aria-hidden="true">?</div>
        <div>
          <div class="caption">you are playing as</div>
          <div class="caption" id="seat" style="color:var(--ink);letter-spacing:.06em">unassigned</div>
        </div>
        <div class="turnbar"><span id="turn-label">idle</span><i id="turn-bar"></i></div>
      </div>

      <div class="grid-wrap">
        <div id="grid" role="grid" aria-label="Game board"></div>
        <svg class="strike" id="strike" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>

      <p class="status">
        <span class="chev">&gt;</span>
        <span class="text" id="status" data-tone="muted" aria-live="polite">connecting</span>
      </p>

      <button class="again" id="again" hidden>play again</button>
     </div>
    </section>

    <!-- Signature element: the wire protocol, on show rather than hidden. -->
    <aside class="scope" aria-label="Protocol inspector">
      <div class="scope-head">
        <span>wire protocol</span>
        <span class="count" id="fcount">0</span>
      </div>

      <ul id="frames"></ul>

      <div class="scope-foot">
        <div class="stat"><div class="k">frames</div><div class="v" id="s-frames">0</div></div>
        <div class="stat"><div class="k">moves</div><div class="v" id="s-moves">0</div></div>
        <div class="stat"><div class="k">rejects</div><div class="v" id="s-rejects">0</div></div>
      </div>

      <div class="legend">
        ↓ server → client &nbsp;·&nbsp; ↑ client → server<br>
        state is authoritative; client sends intent only
      </div>
    </aside>
  </div>
</main>

<script>
"use strict";

/* Wire protocol, mirrored from internal/hub/protocol.go */
const MSG = {
  ASSIGNED: "assigned", STATE: "state", WAITING: "waiting", ERROR: "error",
  OPP_DISCONNECTED: "opponent_disconnected", OPP_RECONNECTED: "opponent_reconnected",
  OPP_LEFT: "opponent_left", REMATCH_OFFERED: "rematch_offered",
  SERVER_SHUTDOWN: "server_shutdown",
};
const MARK    = { EMPTY: 0, X: 1, O: 2 };
const OUTCOME = { LIVE: 0, WIN_X: 1, WIN_O: 2, DRAW: 3 };

const $ = (id) => document.getElementById(id);
const ui = {
  grid: $("grid"), strike: $("strike"), status: $("status"), again: $("again"),
  beacon: $("beacon"), link: $("link"), rtt: $("rtt"), room: $("room"),
  sigil: $("sigil"), seat: $("seat"), turnLabel: $("turn-label"), turnBar: $("turn-bar"),
  frames: $("frames"), fcount: $("fcount"),
  sFrames: $("s-frames"), sMoves: $("s-moves"), sRejects: $("s-rejects"),
};

/* sessionStorage, not localStorage: two tabs are two players, and a shared
   session would make them fight over one seat. */
const store = {
  get() { try { return sessionStorage.getItem("arena_session"); } catch { return null; } },
  set(v) { try { sessionStorage.setItem("arena_session", v); } catch {} },
  clear() { try { sessionStorage.removeItem("arena_session"); } catch {} },
};

let ws = null;
let myMark = MARK.EMPTY;
let board = null;
let prevBoard = new Array(9).fill(0);
let attempts = 0;
let leaving = false;
let sentAt = 0;                       // for measuring move round-trip
const tally = { frames: 0, moves: 0, rejects: 0 };

/* ---------- board construction ---------- */

const cells = [];
for (let i = 0; i < 9; i++) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "cell";
  b.dataset.idx = String(i);
  b.setAttribute("role", "gridcell");
  b.setAttribute("aria-label", "cell " + (i + 1));
  b.disabled = true;
  b.addEventListener("click", () => play(i));
  ui.grid.appendChild(b);
  cells.push(b);
}

ui.again.addEventListener("click", () => {
  send({ type: "rematch" });
  ui.again.disabled = true;
  ui.again.textContent = "waiting for opponent";
});

/* ---------- transport ---------- */

function send(msg) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify(msg));
  logFrame("out", msg.type, msg.type === "move" ? "index " + msg.index : "");
}

function play(i) {
  sentAt = performance.now();
  tally.moves++;
  ui.sMoves.textContent = tally.moves;
  send({ type: "move", index: i });
}

function connect() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  const s = store.get();
  ws = new WebSocket(`${scheme}://${location.host}/ws${s ? "?session=" + encodeURIComponent(s) : ""}`);

  ws.onopen = () => {
    attempts = 0;
    ui.link.textContent = "live";
    ui.beacon.dataset.state = "live";
  };

  ws.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    receive(msg);
  };

  ws.onclose = () => {
    ui.beacon.dataset.state = leaving ? "" : "lost";
    if (leaving) { ui.link.textContent = "closed"; return; }
    retry();
  };

  ws.onerror = () => { ui.beacon.dataset.state = "lost"; };
}

/* Exponential backoff so a server restart isn't hammered by every open tab. */
function retry() {
  attempts++;
  const wait = Math.min(1000 * 2 ** (attempts - 1), 15000);
  ui.link.textContent = "retrying";
  setStatus(`connection lost — retrying in ${Math.round(wait / 1000)}s`, "alert");
  setTimeout(connect, wait);
}

/* ---------- message handling ---------- */

function receive(msg) {
  const d = msg.data || {};

  switch (msg.type) {
    case MSG.ASSIGNED:
      store.set(d.session);
      myMark = d.mark === "X" ? MARK.X : MARK.O;
      ui.sigil.textContent = d.mark;
      ui.sigil.dataset.mark = d.mark;
      ui.seat.textContent = d.mark === "X" ? "player one · moves first" : "player two";
      ui.room.textContent = (d.room || "").slice(0, 8) || "—";
      ui.again.hidden = true;
      ui.again.disabled = false;
      ui.again.textContent = "play again";
      clearStrike();
      prevBoard = new Array(9).fill(0);
      logFrame("in", msg.type, "mark " + d.mark);
      return;

    case MSG.STATE:
      board = d;
      if (sentAt) {
        ui.rtt.textContent = Math.round(performance.now() - sentAt) + "ms";
        sentAt = 0;
      }
      logFrame("in", msg.type, describe(d));
      render();
      return;

    case MSG.WAITING:
      setStatus("waiting for an opponent", "muted");
      break;

    case MSG.ERROR:
      tally.rejects++;
      ui.sRejects.textContent = tally.rejects;
      setStatus(d.reason || "move rejected", "alert");
      logFrame("in", msg.type, d.reason || "", "err");
      return;

    case MSG.OPP_DISCONNECTED:
      setStatus(`opponent dropped · seat held ${d.graceSeconds ?? 30}s`, "alert");
      break;

    case MSG.OPP_RECONNECTED:
      setStatus("opponent reconnected", "muted");
      render();
      break;

    case MSG.OPP_LEFT:
      store.clear();
      setStatus(d.reason || "opponent left", "alert");
      lock();
      break;

    case MSG.REMATCH_OFFERED:
      if (!ui.again.disabled) setStatus("opponent wants a rematch", "muted");
      break;

    case MSG.SERVER_SHUTDOWN:
      leaving = true;
      store.clear();
      setStatus("server shutting down", "alert");
      lock();
      break;
  }

  logFrame("in", msg.type, "");
}

/* ---------- rendering ---------- */

const GLYPH = ["", "X", "O"];
const name  = (m) => GLYPH[m] || "—";

function render() {
  if (!board) return;
  const winning = new Set(board.winLine || []);
  const live = board.outcome === OUTCOME.LIVE;
  const yours = live && board.turn === myMark;

  board.board.forEach((v, i) => {
    const c = cells[i];
    c.textContent = GLYPH[v] || "";
    if (v) c.dataset.mark = GLYPH[v]; else delete c.dataset.mark;

    /* Animate only the cell that changed, so a reconnect that replays the
       whole board doesn't burst every square at once. */
    if (v && !prevBoard[i]) {
      c.dataset.fresh = "1";
      setTimeout(() => delete c.dataset.fresh, 340);
    }
    c.disabled = !!v || !yours;
  });
  prevBoard = board.board.slice();

  ui.turnBar.dataset.turn = live ? name(board.turn) : "";
  ui.turnLabel.textContent = live ? name(board.turn) + " to move" : "final";

  if (live) {
    setStatus(yours ? "your move" : `waiting on ${name(board.turn)}`,
              board.turn === MARK.X ? "x" : "o");
    return;
  }

  lock();
  ui.again.hidden = false;
  drawStrike(board.winLine, board.outcome);

  if (board.outcome === OUTCOME.DRAW) {
    setStatus("draw — board full, no line", "muted", false);
  } else {
    const w = board.outcome === OUTCOME.WIN_X ? MARK.X : MARK.O;
    setStatus(`${name(w)} takes it — ${w === myMark ? "you win" : "you lose"}`,
              w === MARK.X ? "x" : "o", false);
  }
}

function drawStrike(line, outcome) {
  clearStrike();
  if (!line || line.length !== 3) return;
  const at = (i) => ({ x: ((i % 3) + 0.5) * (100 / 3), y: (Math.floor(i / 3) + 0.5) * (100 / 3) });
  let a = at(line[0]), b = at(line[2]);
  // Extend past both ends by a third of a cell.
  const ext = (100 / 3) * 0.34;
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  a = { x: a.x - (dx / len) * ext, y: a.y - (dy / len) * ext };
  b = { x: b.x + (dx / len) * ext, y: b.y + (dy / len) * ext };
  const el = document.createElementNS("http://www.w3.org/2000/svg", "line");
  el.setAttribute("x1", a.x); el.setAttribute("y1", a.y);
  el.setAttribute("x2", b.x); el.setAttribute("y2", b.y);
  const stroke = getComputedStyle(document.documentElement)
    .getPropertyValue(outcome === OUTCOME.WIN_X ? "--x" : "--o").trim();
  el.setAttribute("stroke", stroke);
  el.setAttribute("pathLength", "100");
  // currentColor drives the glow filter, so the halo matches the stroke.
  el.style.color = stroke;
  ui.strike.appendChild(el);
}

function clearStrike() { ui.strike.replaceChildren(); }

function lock() { cells.forEach((c) => (c.disabled = true)); }

function setStatus(text, tone = "muted", caret = true) {
  ui.status.dataset.tone = tone;
  ui.status.textContent = text;
  if (caret) {
    const c = document.createElement("span");
    c.className = "caret";
    ui.status.appendChild(c);
  }
}

/* Compact one-line summary of a state frame, in the inspector's voice. */
function describe(s) {
  const filled = s.board.filter(Boolean).length;
  if (s.outcome === OUTCOME.LIVE) return `turn ${name(s.turn)} · ${filled}/9`;
  if (s.outcome === OUTCOME.DRAW) return "draw";
  return `win ${s.outcome === OUTCOME.WIN_X ? "X" : "O"} · line ${(s.winLine || []).join(",")}`;
}

/* ---------- the inspector ---------- */

let lastAt = 0;
function logFrame(dir, type, detail, kind) {
  const now = performance.now();
  const delta = lastAt ? `+${Math.round(now - lastAt)}ms` : "—";
  lastAt = now;

  tally.frames++;
  ui.sFrames.textContent = tally.frames;
  ui.fcount.textContent = tally.frames;

  const li = document.createElement("li");
  li.className = "frame";
  li.dataset.dir = dir;
  if (kind) li.dataset.kind = kind;

  const arrow = document.createElement("span");
  arrow.className = "dir";
  arrow.textContent = dir === "in" ? "↓" : "↑";

  const label = document.createElement("span");
  label.className = "name";
  label.textContent = detail ? `${type} · ${detail}` : type;

  const meta = document.createElement("span");
  meta.className = "meta";
  meta.textContent = delta;

  li.append(arrow, label, meta);
  ui.frames.appendChild(li);

  /* Bound the log so a long session can't grow the DOM without limit. */
  while (ui.frames.children.length > 60) ui.frames.removeChild(ui.frames.firstChild);
  ui.frames.scrollTop = ui.frames.scrollHeight;
}

window.addEventListener("beforeunload", () => { leaving = true; });

connect();
</script>
</body>
</html>
